<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Productos</title>
</head>
<body>
    <h1>Lista de Productos</h1>
    <a href="/vista/productos/nuevo">Crear nuevo producto</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.id}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.precio}"></td>
                <td th:text="${producto.stock}"></td>
                <td>
                    <a th:href="@{'/vista/productos/' + ${producto.id}}">Ver</a> |
                    <a th:href="@{'/vista/productos/editar/' + ${producto.id}}">Editar</a> |
                    <a th:href="@{'/vista/productos/eliminar/' + ${producto.id}}"
                       onclick="return confirm('¿Seguro que querés eliminarlo?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
