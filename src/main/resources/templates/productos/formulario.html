<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
</head>
<body>
    <h1 th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h1>
    <form th:action="@{/vista/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}" />
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required /><br>
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" required /><br>
        <label>Stock:</label>
        <input type="number" th:field="*{stock}" required /><br>
        <button type="submit">Guardar</button>
    </form>
    <a href="/vista/productos">Volver</a>
</body>
</html>
